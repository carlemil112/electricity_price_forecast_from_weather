services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db

  
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server .port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
      